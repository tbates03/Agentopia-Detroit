name: City Import Staging
on:
  pull_request:
    paths:
      - "scripts/import_city_manifest.py"
      - "scripts/test_city_import.py"
      - "docs/CITY_IMPORT.md"
      - ".github/workflows/city-import.yml"
  push:
    branches: [main]
    paths:
      - "scripts/import_city_manifest.py"
      - "scripts/test_city_import.py"
      - "docs/CITY_IMPORT.md"
      - ".github/workflows/city-import.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile City Builder importer
        run: python3 -m py_compile scripts/import_city_manifest.py scripts/test_city_import.py
      - name: Run isolated-city tests
        run: python3 scripts/test_city_import.py
