name: World League Validation

on:
  pull_request:
    paths:
      - "research/**"
      - "LEADERBOARD.md"
      - "scripts/build_leaderboard.py"
      - "scripts/export_world_beacon.py"
      - "scripts/detroit_world_context.py"
      - "scripts/detroit_world_context_daemon.py"
      - "scripts/detroit_mobility_time.py"
      - "live_world/server.py"
      - "live_world/static/world-league.html"
      - ".github/workflows/world-league.yml"
  push:
    branches: [main]
    paths:
      - "research/**"
      - "LEADERBOARD.md"
      - "scripts/build_leaderboard.py"
      - "scripts/export_world_beacon.py"
      - "scripts/detroit_world_context.py"
      - "scripts/detroit_world_context_daemon.py"
      - "scripts/detroit_mobility_time.py"
      - "live_world/server.py"
      - "live_world/static/world-league.html"
      - ".github/workflows/world-league.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python
        run: python -m py_compile scripts/build_leaderboard.py scripts/export_world_beacon.py scripts/detroit_world_context.py scripts/detroit_world_context_daemon.py scripts/detroit_mobility_time.py live_world/server.py
      - name: Validate submission JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = (
              list(Path("research/submissions").glob("*.json"))
              + list(Path("research/packs").glob("*.json"))
              + list(Path("research/culture_calendars").glob("*.json"))
              + list(Path("research/schema").glob("*.json"))
          )
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY
      - name: Check generated leaderboard
        run: python scripts/build_leaderboard.py --check
