<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111d">
  <title>Agentopia Detroit | Classic Dashboard and Optional 3D City</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #07111d; color: #eaf1fa; }
    body { display: flex; flex-direction: column; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #0e2339; border-bottom: 1px solid #28445a; padding: 9px 16px; min-height: 60px; z-index: 2; }
    .brand { display: flex; flex-direction: column; gap: 2px; min-width: 178px; flex: 1 1 auto; }
    .brand strong { font-size: 14px; letter-spacing: .04em; }
    .brand small { font-size: 11px; color: #acc2d0; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .actions button, .actions a { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 37px; border: 1px solid #507087; border-radius: 7px; padding: 7px 12px; background: #193a53; color: #ecf5fb; font: 600 12px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    .actions button:hover, .actions a:hover { border-color: #f9ce62; }
    .actions button[aria-pressed="true"] { background: #ffcb05; border-color: #ffcb05; color: #00274c; }
    .stage { position: relative; flex: 1 1 auto; min-height: 0; }
    .stage iframe { display: block; width: 100%; height: 100%; border: 0; background: #07111d; }
    .stage iframe[hidden] { display: none !important; }
    #status { position: absolute; z-index: 1; bottom: 16px; left: 16px; max-width: calc(100% - 32px); padding: 10px 14px; color: #ffdd99; background: #132b3e; border: 1px solid #a87937; border-radius: 8px; box-shadow: 0 4px 18px #0006; }
    #status[hidden] { display: none; }
    @media (max-width: 750px) {
      .toolbar { gap: 7px; padding: 7px 10px; }
      .brand { min-width: auto; }
      .brand strong { font-size: 12px; }
      .brand small { font-size: 10px; }
      .actions button, .actions a { padding: 6px 8px; min-height: 32px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <!-- IMPORTANT: the original observer is the DEFAULT, not a map overlay. -->
  <header class="toolbar">
    <div class="brand">
      <strong>AGENTOPIA DETROIT</strong>
      <small>Classic dashboard first. Geographic 3D is optional.</small>
    </div>
    <nav class="actions" aria-label="Agentopia displays">
      <button id="classic-button" type="button" aria-pressed="true">Classic Dashboard</button>
      <button id="map-button" type="button" aria-pressed="false">3D Detroit Map</button>
      <a id="original-link" href="/" target="_blank" rel="noopener">Open Classic Separately</a>
      <a id="iso-link" href="/isometric-explorer.html?era=2045" target="_blank" rel="noopener">Isometric Explorer</a>
    </nav>
  </header>
  <main class="stage" aria-label="Agentopia view">
    <!-- The untouched observer owns all tabs, buttons, panels and simulation controls. -->
    <iframe id="classic" src="/" title="Original Agentopia Classic: Neighborhood, Buildings, Relationships, and all society panels"></iframe>
    <!-- Do not start the GPU-heavy 3D viewer until the user explicitly chooses it. -->
    <iframe id="geo" title="Optional mapped 3D Detroit city" hidden></iframe>
    <div id="status" role="status" aria-live="polite" hidden></div>
  </main>
  <script>
  (() => {
    "use strict";
    const classic = document.getElementById("classic");
    const geo = document.getElementById("geo");
    const classicButton = document.getElementById("classic-button");
    const mapButton = document.getElementById("map-button");
    const isoLink = document.getElementById("iso-link");
    const status = document.getElementById("status");
    const params = new URLSearchParams(location.search);
    const era = /^\d{4}$/.test(params.get("era") || "") && Number(params.get("era")) >= 1701 && Number(params.get("era")) <= 2045 ? params.get("era") : "2045";
    isoLink.href = "/isometric-explorer.html?era=" + encodeURIComponent(era);
    const mapUrl = "/city-geo/index.html?era=" + encodeURIComponent(era) + "&gpu=webgl2&v=219";
    let active = "classic";
    function warn(message) { status.textContent = message || ""; status.hidden = !message; }
    function select(mode) {
      active = mode;
      const isMap = mode === "3d";
      classic.hidden = isMap;
      geo.hidden = !isMap;
      classicButton.setAttribute("aria-pressed", String(!isMap));
      mapButton.setAttribute("aria-pressed", String(isMap));
      warn("");
      if (isMap && !geo.getAttribute("src")) geo.src = mapUrl;
      if (!isMap && geo.getAttribute("src")) {
        // Release 3D GPU work on return. Classic state stays in its own live iframe.
        geo.removeAttribute("src");
        geo.src = "about:blank";
        geo.removeAttribute("src");
      }
      const url = new URL(location.href);
      if (isMap) url.searchParams.set("view", "3d");
      else url.searchParams.delete("view");
      history.replaceState(null, "", url.pathname + url.search + url.hash);
    }
    classicButton.addEventListener("click", () => select("classic"));
    mapButton.addEventListener("click", () => select("3d"));
    classic.addEventListener("load", () => {
      try {
        const d = classic.contentDocument;
        if (!d || !d.querySelector('.view-tabs [data-view="map"]') || !d.querySelector('[data-view="buildings"]')) {
          if (active === "classic") warn("The original classic dashboard did not expose its usual tabs. Open http://127.0.0.1:8766/ directly.");
        }
      } catch (_) {
        if (active === "classic") warn("The classic dashboard is not accessible inside this view; open http://127.0.0.1:8766/ directly.");
      }
    });
    geo.addEventListener("load", () => {
      if (active !== "3d") return;
      try {
        if (!geo.contentDocument?.getElementById("scene")) {
          warn("The 3D viewer is unavailable. Choose Classic Dashboard to return to your original controls.");
        }
      } catch (_) { warn("The 3D viewer could not be inspected; choose Classic Dashboard to return."); }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && active === "3d") select("classic");
    });
    // The old page used to auto-overlay the 3D map. Do not do that here.
    // A bookmarked ?era=2045 MUST still open the complete classic observer.
    if (params.get("view") === "3d") select("3d");
  })();
  </script>
</body>
</html>
